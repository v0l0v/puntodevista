name: Actualizar feeds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Configurar git
        run: |
          git config user.name "pdv bot"
          git config user.email "actions@github.com"

      - name: Actualizar listas de feeds (sin Firecrawl, 0 créditos)
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python3 update_lists.py

      - name: Enviar noticias nuevas a Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 telegram_news.py

      - name: Commit y push del estado de Telegram
        run: |
          git add telegram_sent.json
          git commit -m "chore: telegram news state $(date +%Y-%m-%d)" || echo "nada que commitear"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash || true
            git push && break || sleep 5
          done
