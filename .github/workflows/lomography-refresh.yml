name: Refrescar Lomography

on:
  schedule:
    # Cada 2 horas en horas impares UTC (01,03,...,23): evita chocar con el
    # digest de las 04:00, que ya scrapea la revista. ~12 refrescos/día.
    - cron: '0 1-23/2 * * *'
  workflow_dispatch:

concurrency:
  group: feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-lomo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar git
        run: |
          git config user.name "pdv bot"
          git config user.email "actions@github.com"

      - name: Refrescar Lomography (gratis vía Jina, 0 créditos)
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python3 update_lists.py --fresh-lomography
