name: Digest diario

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar firecrawl CLI
        run: npm install -g firecrawl-cli

      - name: Configurar git
        run: |
          git config user.name "pdv bot"
          git config user.email "actions@github.com"

      - name: Generar digest diario (prioridad máxima)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          cat <<EOF > config.json
          {
            "email": {
              "address": "$EMAIL_ADDRESS",
              "app_password": "$EMAIL_PASSWORD"
            }
          }
          EOF
          python3 daily_digest.py

      - name: Actualizar datos estáticos (caches de artículos)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python3 update_static_data.py --keep-lomo

      - name: Commit y push de digests
        run: |
          git add resumenes
          git commit -m "chore: daily digest $(date +%Y-%m-%d)" || echo "nada que commitear"
          git pull --rebase --autostash || true
          git push
