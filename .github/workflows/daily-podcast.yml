name: Podcast diario a Telegram

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: daily-podcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests edge-tts Pillow

      - name: Configurar git
        run: |
          git config user.name "pdv bot"
          git config user.email "actions@github.com"

      - name: Enviar resumen y podcast a Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python3 daily_telegram.py

      - name: Publicar episodio en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view episodios >/dev/null 2>&1 || \
            gh release create episodios --title "Punto de vista · podcast" --notes "Episodios diarios del podcast de Punto de vista"
          DATE=$(date +%F)
          MP3="podcast/podcast-${DATE}.mp3"
          COVER="podcast-cover-${DATE}.png"
          if [ -f "$MP3" ]; then
            gh release upload episodios "$MP3" --clobber
          else
            echo "Sin episodio hoy"
          fi
          if [ -f "$COVER" ]; then
            gh release upload episodios "$COVER" --clobber
          fi

      - name: Regenerar feed RSS del podcast
        run: python3 generate_podcast_feed.py

      - name: Commit y push del feed
        run: |
          git add podcast_meta.json podcast.xml
          git commit -m "chore: podcast feed $(date +%F)" || echo "nada que commitear"
          git pull --rebase --autostash || true
          git push
