name: Podcast diario a Telegram

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_run:
    workflows: ["Digest diario"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Fecha del episodio (YYYY-MM-DD), vacío para hoy'
        required: false
        default: ''

concurrency:
  group: daily-podcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  podcast:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          which ffmpeg || { sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y ffmpeg; }
          pip install requests edge-tts Pillow sqlite-vec

      - name: Configurar git
        run: |
          git config user.name "pdv bot"
          git config user.email "actions@github.com"

      - name: Enviar resumen y podcast a Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          TARGET_DATE="${{ inputs.target_date }}"
          if [ -n "$TARGET_DATE" ]; then
            python3 daily_podcast.py "$TARGET_DATE"
          else
            python3 daily_podcast.py
          fi

      - name: Publicar episodio en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view episodios >/dev/null 2>&1 || \
            gh release create episodios --title "Punto de vista · podcast" --notes "Episodios diarios del podcast de Punto de vista"
          TARGET_DATE="${{ inputs.target_date }}"
          DATE="${TARGET_DATE:-$(date +%F)}"
          MP3="podcast/podcast-${DATE}.mp3"
          COVER="podcast-cover-${DATE}.jpg"
          if [ -f "$MP3" ]; then
            gh release upload episodios "$MP3" --clobber
          else
            echo "Sin episodio hoy"
          fi
          if [ -f "$COVER" ]; then
            gh release upload episodios "$COVER" --clobber
          elif [ -f "podcast-cover-${DATE}.png" ]; then
            gh release upload episodios "podcast-cover-${DATE}.png" --clobber
          fi

      - name: Regenerar feed RSS del podcast
        run: python3 generate_podcast_feed.py

      - name: Commit y push del feed
        run: |
          git add podcast_meta.json podcast.xml
          git commit -m "chore: podcast feed $(date +%F)" || echo "nada que commitear"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash || true
            git push && break || sleep 5
          done
