<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Punto de vista</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#entries">Saltar al contenido</a>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html" style="text-decoration:none;color:inherit"><span class="logo-text">Punto de vista</span></a>
    <div class="header-controls" role="toolbar" aria-label="Controles de filtro">
      <a id="podcast-filter-btn" class="sources-btn podcast-btn" href="episodios.html" aria-label="Ir a los episodios del podcast">podcast</a>
      <button id="date-btn" class="sources-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="date-panel" aria-label="Filtrar por fecha">
        cuando <span id="date-btn-label">todo</span> ⌄
      </button>
      <button id="sources-btn" class="sources-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="sources-panel" aria-label="Seleccionar fuentes">
        fuentes <span id="sources-btn-count" aria-live="polite">todas</span> ⌄
      </button>
      <button id="fullscreen-btn" class="sources-btn" type="button" aria-label="Pantalla completa" onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>
  <div id="date-panel" class="hide">
    <button class="date-row active" data-period="all" aria-pressed="true">Todo el tiempo</button>
    <button class="date-row" data-period="year"  aria-pressed="false">Este año</button>
    <div id="date-months" class="date-months-grid"></div>
    <button class="date-row" data-period="month" aria-pressed="false">Este mes</button>
    <button class="date-row" data-period="week"  aria-pressed="false">Esta semana</button>
    <button class="date-row" data-period="day"   aria-pressed="false">Hoy</button>
  </div>
  <div id="sources-panel" class="hide">
    <label class="source-row all" id="source-all-row">
      <input type="checkbox" id="chk-all" checked>
      <span>Todas</span>
      <span class="src-count" id="count-all">0</span>
    </label>
    <label class="source-row" data-src="colossal"><input type="checkbox" data-src="colossal"><span>Colossal</span><span class="src-count" id="count-colossal">0</span></label>
    <label class="source-row" data-src="lomography"><input type="checkbox" data-src="lomography"><span>Lomography</span><span class="src-count" id="count-lomography">0</span></label>
    <label class="source-row" data-src="booooooom"><input type="checkbox" data-src="booooooom"><span>Booooooom</span><span class="src-count" id="count-booooooom">0</span></label>
    <label class="source-row" data-src="tpj"><input type="checkbox" data-src="tpj"><span>Photographic Journal</span><span class="src-count" id="count-tpj">0</span></label>
    <label class="source-row" data-src="swan"><input type="checkbox" data-src="swan"><span>Swann</span><span class="src-count" id="count-swan">0</span></label>
    <label class="source-row" data-src="huck"><input type="checkbox" data-src="huck"><span>Huck</span><span class="src-count" id="count-huck">0</span></label>
    <label class="source-row" data-src="lensculture"><input type="checkbox" data-src="lensculture"><span>LensCulture</span><span class="src-count" id="count-lensculture">0</span></label>
    <label class="source-row" data-src="odlp"><input type="checkbox" data-src="odlp"><span>L'Œil de la Photographie</span><span class="src-count" id="count-odlp">0</span></label>
    <label class="source-row" data-src="magnum"><input type="checkbox" data-src="magnum"><span>Magnum Photos</span><span class="src-count" id="count-magnum">0</span></label>
    <label class="source-row" data-src="shootitwithfilm"><input type="checkbox" data-src="shootitwithfilm"><span>Shoot It With Film</span><span class="src-count" id="count-shootitwithfilm">0</span></label>
  </div>
</header>

<div id="loader"><span style="color:#ff0100">●</span> cargando feed…</div>

<div id="podcast-hero" class="hide" aria-label="Podcast del día">
  <div class="podcast-hero-inner">
    <img id="podcast-hero-img" src="" alt="Punto de vista — podcast">
    <div class="podcast-hero-body">
      <span class="podcast-hero-badge"><span class="podcast-dot"></span> Podcast · Punto de vista</span>
      <h2 id="podcast-hero-title"></h2>
      <div class="podcast-hero-meta">
        <span id="podcast-hero-meta"></span>
        <a href="episodios.html">todos los episodios →</a>
        <a href="podcast.xml">suscripción rss</a>
        <a href="#" id="podcast-hero-resumen" role="button">resumen</a>
      </div>
    </div>
    <div class="podcast-player" id="podcast-hero-player" data-url="">
      <button class="podcast-play" aria-label="Reproducir">▶</button>
      <div class="podcast-progress"><div class="podcast-progress-fill"></div></div>
      <span class="podcast-time">0:00 / --:--</span>
      <input type="range" class="podcast-volume" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
    </div>
  </div>
</div>

<main id="entries"></main>

<div id="modal" class="hide" role="dialog" aria-modal="true" aria-label="Detalle del artículo">
  <div id="modal-backdrop"></div>
  <div id="modal-panel">
    <div id="modal-body"></div>
  </div>
</div>

<div id="podcast-player-bar" class="hide">
  <div class="bar-inner">
    <img id="bar-img" src="" alt="">
    <div class="bar-info">
      <div id="bar-badge"><span class="podcast-dot"></span> Podcast · Punto de vista</div>
      <div id="bar-title"></div>
    </div>
    <div class="podcast-player" id="bar-player" data-url="">
      <button class="podcast-play" aria-label="Reproducir">▶</button>
      <div class="podcast-progress"><div class="podcast-progress-fill"></div></div>
      <span class="podcast-time">0:00 / --:--</span>
      <input type="range" class="podcast-volume" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
    </div>
    <button id="bar-close" onclick="closePlayerBar()" aria-label="Cerrar reproductor">✕</button>
  </div>
</div>

<footer>
  <a href="podcast.xml">podcast</a>
  <span id="footer-info"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
