<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast · Punto de vista</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; }

  .header-controls a.sources-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  #episodes {
    max-width: 1600px;
    margin: 0 auto;
    padding: var(--gap);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
    gap: var(--gap);
  }

  .episode.is-playing,
  .episode.is-playing:hover {
    z-index: 2;
    box-shadow:
      0 0 0 1.5px rgba(255, 1, 0, 0.9),
      0 0 35px rgba(255, 1, 0, 0.35);
  }

  .ep-empty { grid-column: 1 / -1; text-align: center; color: rgba(240,236,228,0.4); padding: 4rem 0; }

  #loader { max-width: 1600px; margin: 2rem auto; padding: 0 2rem; }

  @media (max-width: 720px) {
    #episodes { grid-template-columns: 1fr; gap: 2px; padding: 2px; }
    .card { aspect-ratio: 16 / 9; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#episodes">Saltar al contenido</a>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html" style="text-decoration:none;color:inherit">
      <span class="logo-text">Punto de vista</span>
    </a>
    <div class="header-controls" role="toolbar" aria-label="Controles de filtro">
      <div class="search-container">
        <div id="search-input-wrapper">
          <input type="search" id="search-input" placeholder="Buscar…" aria-label="Buscar episodios">
          <button id="search-clear" type="button" aria-label="Limpiar búsqueda">✕</button>
        </div>
      </div>
      <a id="podcast-filter-btn" class="sources-btn podcast-btn active" href="episodios.html" aria-label="Ir a los episodios del podcast">podcast</a>
      <a id="date-btn" class="sources-btn" href="index.html?panel=date" aria-label="Filtrar artículos por fecha">
        cuando <span id="date-btn-label">todo</span> ⌄
      </a>
      <a id="sources-btn" class="sources-btn" href="index.html?panel=sources" aria-label="Seleccionar fuentes de artículos">
        fuentes <span id="sources-btn-count" aria-live="polite">todas</span> ⌄
      </a>
      <button id="fullscreen-btn" class="sources-btn" type="button" aria-label="Pantalla completa" onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>
</header>

<div id="podcast-hero" class="hide" aria-label="Podcast del día">
  <div class="podcast-hero-inner">
    <img id="podcast-hero-img" src="podcast-cover.png" alt="Punto de vista — podcast">
    <div class="podcast-hero-body">
      <span class="podcast-hero-badge"><span class="podcast-dot"></span> Podcast · Punto de vista</span>
      <h1 id="podcast-hero-title"></h1>
      <div class="podcast-hero-meta">
        <span id="podcast-hero-meta"></span>
        <a href="index.html">← feed de artículos</a>
        <a href="podcast.xml">suscripción rss</a>
        <a href="#" id="podcast-hero-resumen" role="button">resumen</a>
      </div>
    </div>
    <div class="podcast-player" id="podcast-hero-player" data-url="">
      <button class="podcast-play" aria-label="Reproducir">▶</button>
      <div class="podcast-progress"><div class="podcast-progress-fill"></div></div>
      <span class="podcast-time">0:00 / --:--</span>
      <input type="range" class="podcast-volume" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
    </div>
  </div>
</div>

<div id="loader"><span style="color:#ff0100">●</span> cargando episodios…</div>
<main id="episodes"></main>

<div id="modal" class="hide" role="dialog" aria-modal="true" aria-label="Resumen del episodio">
  <div id="modal-backdrop"></div>
  <div id="modal-panel">
    <div id="modal-body"></div>
  </div>
</div>

<footer>
  <a href="index.html">punto de vista</a>
  <span>podcast diario</span>
</footer>

<script>
const RELEASE = 'https://github.com/v0l0v/puntodevista/releases/download/episodios';
const COVER = 'podcast-cover.png';

function epCover(date) {
  return RELEASE + '/podcast-cover-' + date + '.png';
}

function epLocalCover(date) {
  return 'assets/covers/podcast-cover-' + date + '.png';
}
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function toggleFullscreen() {
  const el = document.documentElement;
  const rq = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || el.mozRequestFullScreen;
  const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen || document.mozCancelFullScreen;
  if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement && !document.mozFullScreen) {
    rq.call(el).catch(() => {});
  } else {
    ex.call(document).catch(() => {});
  }
}

function updateFullscreenBtn() {
  const btn = document.getElementById('fullscreen-btn');
  if (!btn) return;
  const fs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.mozFullScreen);
  btn.textContent = fs ? '\u26E7' : '\u26F6';
  btn.setAttribute('aria-label', fs ? 'Salir de pantalla completa' : 'Pantalla completa');
  if (fs) sessionStorage.setItem('fs', '1'); else sessionStorage.removeItem('fs');
}

document.addEventListener('fullscreenchange', updateFullscreenBtn);
document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);
document.addEventListener('msfullscreenchange', updateFullscreenBtn);
document.addEventListener('mozfullscreenchange', updateFullscreenBtn);
updateFullscreenBtn();
if (sessionStorage.getItem('fs')) {
  const el = document.documentElement;
  const rq = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || el.mozRequestFullScreen;
  rq.call(el).catch(() => {});
}

function fmtFecha(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return d + ' de ' + MESES[m - 1] + ' de ' + y;
}

function fmtDur(s) {
  if (!s) return '--:--';
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function epImgLoaded(img) {
  img.classList.add('loaded');
  const card = img.closest('.card');
  const sk = card && card.querySelector('.card-skeleton');
  if (sk) sk.remove();
}

function epImgError(img) {
  const card = img.closest('.card');
  const date = card ? card.dataset.id : (img.dataset.date || '');
  const stage = parseInt(img.dataset.stage || '0', 10);

  // 1. Probar releases (stage 0 ya intentado al inicio) -> Fallback a assets/covers/
  if (stage === 0 && date) {
    img.dataset.stage = '1';
    img.src = epLocalCover(date);
    return;
  }
  // 2. Fallback a la imagen del artículo (e.image)
  if (stage <= 1 && img.dataset.rawImage) {
    img.dataset.stage = '2';
    img.src = img.dataset.rawImage;
    return;
  }
  // 3. Fallback final a podcast-cover.png
  if (stage <= 2) {
    img.dataset.stage = '3';
    img.src = COVER;
    return;
  }
  if (card) {
    const sk = card.querySelector('.card-skeleton');
    if (sk) sk.remove();
    const overlay = card.querySelector('.card-overlay');
    if (overlay) overlay.remove();
  }
  img.remove();
}

function splitItems(desc) {
  if (!desc) return [];
  return desc.split(/\n{2,}|(?=\*\*)/).map(s => s.trim()).filter(Boolean);
}

function fmtDesc(desc) {
  const items = splitItems(desc);
  if (items.length <= 1) return esc(desc);
  return items.map(i => '<p style="margin:0 0 0.6rem">' + esc(i) + '</p>').join('');
}

let episodes = [];
let current = null;
let activeCard = null;

function cassetteSound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = cassetteSound.ctx || (cassetteSound.ctx = new Ctx());
    if (ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = 0.16;
    master.connect(ctx.destination);

    const thunk = (t, f, d, g) => {
      const o = ctx.createOscillator();
      const og = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.45, t + d);
      og.gain.setValueAtTime(g, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(og).connect(master);
      o.start(t); o.stop(t + d + 0.02);
    };
    const click = () => {
      const len = Math.floor(ctx.sampleRate * 0.035);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 1;
      const g = ctx.createGain(); g.gain.value = 0.7;
      src.connect(bp).connect(g).connect(master);
      src.start(t0);
    };

    thunk(t0, 115, 0.16, 0.55);
    click();
    thunk(t0 + 0.1, 85, 0.22, 0.45);

    const mlen = Math.floor(ctx.sampleRate * 0.35);
    const mbuf = ctx.createBuffer(1, mlen, ctx.sampleRate);
    const mdata = mbuf.getChannelData(0);
    for (let i = 0; i < mlen; i++) mdata[i] = (Math.random() * 2 - 1) * Math.sin(i / mlen * Math.PI);
    const motor = ctx.createBufferSource();
    motor.buffer = mbuf;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 850;
    const mg = ctx.createGain();
    mg.gain.setValueAtTime(0.35, t0 + 0.1);
    mg.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
    motor.connect(lp).connect(mg).connect(master);
    motor.start(t0 + 0.1); motor.stop(t0 + 0.52);
  } catch (e) {}
}

function radioEls() {
  const player = document.getElementById('podcast-hero-player');
  return {
    player,
    btn: player.querySelector('.podcast-play'),
    fill: player.querySelector('.podcast-progress-fill'),
    time: player.querySelector('.podcast-time'),
  };
}

function ensureRadio(url) {
  if (current && current.url === url) return current;
  if (current) { current.audio.pause(); current.audio.src = ''; }
  const { player, btn, fill, time } = radioEls();
  const audio = new Audio(url);
  audio.preload = 'none';
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    time.textContent = fmtDur(Math.floor(audio.currentTime)) + ' / ' + fmtDur(Math.floor(audio.duration));
  });
  audio.addEventListener('loadedmetadata', () => { time.textContent = '0:00 / ' + fmtDur(Math.floor(audio.duration)); });
  audio.addEventListener('playing', () => {
    btn.textContent = '⏸';
    player.classList.add('is-playing');
  });
  audio.addEventListener('pause', () => {
    btn.textContent = '▶';
    player.classList.remove('is-playing');
  });
  audio.addEventListener('ended', () => {
    btn.textContent = '▶';
    fill.style.width = '0%';
    time.textContent = '0:00 / ' + fmtDur(Math.floor(audio.duration));
    player.classList.remove('is-playing');
    if (activeCard) activeCard.classList.remove('is-playing');
    activeCard = null;
    current = null;
  });
  current = { audio, url, player, btn, fill, time };
  return current;
}

function selectEpisode(card) {
  const e = episodes.find(x => String(x.date) === card.dataset.id);
  if (!e) return;
  cassetteSound();
  const url = RELEASE + '/podcast-' + e.date + '.mp3';
  const r = ensureRadio(url);
  const num = episodes.length - episodes.indexOf(e);
  const heroImg = document.getElementById('podcast-hero-img');
  if (heroImg) {
    heroImg.dataset.date = e.date;
    heroImg.dataset.stage = '0';
    heroImg.dataset.rawImage = e.image || '';
    heroImg.onerror = function() { epImgError(this); };
    heroImg.src = epCover(e.date);
  }
  document.getElementById('podcast-hero-title').textContent = e.podcast_title || 'Resumen diario';
  document.getElementById('podcast-hero-meta').textContent = 'episodio ' + num + ' · ' + fmtFecha(e.date) + ' · ' + fmtDur(e.duration);
  const resumen = document.getElementById('podcast-hero-resumen');
  if (resumen) resumen.onclick = (ev) => { ev.preventDefault(); openPodcastResumen(e); };
  r.player.dataset.url = url;
  r.fill.style.width = '0%';
  r.time.textContent = '0:00 / ' + fmtDur(e.duration);
  document.querySelectorAll('.episode.is-playing').forEach(c => c.classList.remove('is-playing'));
  activeCard = card;
  card.classList.add('is-playing');
  r.audio.play().catch(() => {});
  document.getElementById('podcast-hero').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function openPodcastResumen(e) {
  const body = document.getElementById('modal-body');
  if (!body) return;
  body.innerHTML =
    '<div class="modal-tools">' +
    '<button class="modal-tool-btn" onclick="closeModal()">← Volver</button>' +
    '</div>' +
    '<div class="modal-title-group">' +
    '<h2 class="modal-title">' + esc(e.podcast_title || 'Resumen Diario') + '</h2>' +
    '<div class="modal-meta"><span class="modal-source">Podcast · Punto de vista</span></div>' +
    '</div>' +
    '<div class="modal-article"><div class="modal-article-content">' +
    (e.description ? fmtDesc(e.description) : '<p style="opacity:0.4">Sin descripción</p>') +
    '</div></div>';
  document.getElementById('modal').classList.remove('hide');
}

function closeModal() {
  document.getElementById('modal').classList.add('hide');
}

function bindRadio(root) {
  root.addEventListener('click', (e) => {
    const play = e.target.closest('.podcast-play');
    if (play) {
      if (current) {
        if (current.audio.paused) { cassetteSound(); current.audio.play().catch(() => {}); }
        else current.audio.pause();
      }
      return;
    }
    const progress = e.target.closest('.podcast-progress');
    if (progress) {
      if (current && current.audio.duration) {
        const r = progress.getBoundingClientRect();
        current.audio.currentTime = ((e.clientX - r.left) / r.width) * current.audio.duration;
      }
      return;
    }
    const card = e.target.closest('.episode');
    if (card) selectEpisode(card);
  });

  root.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('episode')) {
      e.preventDefault();
      selectEpisode(e.target);
    }
    if (e.key === 'Escape') closeModal();
  });

  document.getElementById('modal-backdrop').addEventListener('click', closeModal);

  root.addEventListener('input', (e) => {
    const vol = e.target.closest('.podcast-volume');
    if (vol && current && current.audio) current.audio.volume = parseFloat(vol.value);
  });
}

function renderEpisodes(meta) {
  const el = document.getElementById('episodes');
  if (!meta || !meta.length) {
    el.innerHTML = '<div class="ep-empty">todavía no hay episodios</div>';
    document.getElementById('loader').classList.add('hide');
    return;
  }

  episodes = [...meta].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const latest = episodes[0];
  const heroImg = document.getElementById('podcast-hero-img');
  const heroTitle = document.getElementById('podcast-hero-title');
  const heroMeta = document.getElementById('podcast-hero-meta');
  if (heroImg) {
    heroImg.dataset.date = latest.date;
    heroImg.dataset.stage = '0';
    heroImg.dataset.rawImage = latest.image || '';
    heroImg.onerror = function() { epImgError(this); };
    heroImg.src = epCover(latest.date);
  }
  if (heroTitle) heroTitle.textContent = latest.podcast_title || 'Resumen diario';
  if (heroMeta) heroMeta.textContent = 'episodio ' + episodes.length + ' · ' + fmtFecha(latest.date) + ' · ' + fmtDur(latest.duration);
  const resumen = document.getElementById('podcast-hero-resumen');
  if (resumen) resumen.onclick = (ev) => { ev.preventDefault(); openPodcastResumen(latest); };
  ensureRadio(RELEASE + '/podcast-' + latest.date + '.mp3');
  document.getElementById('podcast-hero').classList.remove('hide');
  renderEpisodeList(episodes);
  document.getElementById('loader').classList.add('hide');

  // ── Buscador en vivo para episodios ──
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (searchClear) searchClear.classList.toggle('visible', !!q);
      const filtered = !q ? episodes : episodes.filter(ep => {
        const text = `${ep.podcast_title || ''} ${ep.description || ''} ${ep.date || ''}`.toLowerCase();
        return text.includes(q);
      });
      renderEpisodeList(filtered);
    });
    if (searchClear) {
      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchClear.classList.remove('visible');
        renderEpisodeList(episodes);
      });
    }
  }
}

function renderEpisodeList(list) {
  const el = document.getElementById('episodes');
  if (!list || !list.length) {
    el.innerHTML = '<div class="ep-empty">No se encontraron episodios para esta búsqueda</div>';
    return;
  }
  el.innerHTML = list.map((e) => {
    const num = episodes.length - episodes.indexOf(e);
    const title = e.podcast_title || 'Resumen diario';
    const rawImg = e.image || '';
    return `<div class="card episode" data-color="1" data-id="${e.date}" role="button" tabindex="0" aria-label="Cargar y reproducir episodio ${num}">
      <div class="card-inner">
        <div class="card-skeleton"></div>
        <img class="card-image" src="${epCover(e.date)}" data-date="${e.date}" data-stage="0" data-raw-image="${esc(rawImg)}" alt="" loading="lazy" onload="epImgLoaded(this)" onerror="epImgError(this)">
        <div class="card-overlay color"></div>
      </div>
      <div class="card-info">
        <div class="card-source">Episodio ${num} · ${fmtFecha(e.date)}</div>
        <div class="card-title">${esc(title)}</div>
        <div class="card-meta">
          <span class="card-date">${fmtDur(e.duration)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ─── Card Tilt / Parallax (igual que la portada) ────────────────────────────
(function initCardTilt() {
  const MAX_ANGLE = 12;
  const grid = document.getElementById('episodes');
  if (!grid) return;
  let rafId = null;
  let activeCard = null;
  let targetRx = 0, targetRy = 0, targetTx = 0, targetTy = 0;
  let currentRx = 0, currentRy = 0, currentTx = 0, currentTy = 0;

  function lerp(a, b, t) { return a + (b - a) * t; }

  function animate() {
    if (!activeCard) return;
    const speed = 0.12;
    currentRx = lerp(currentRx, targetRx, speed);
    currentRy = lerp(currentRy, targetRy, speed);
    currentTx = lerp(currentTx, targetTx, speed);
    currentTy = lerp(currentTy, targetTy, speed);
    activeCard.style.setProperty('--rx', currentRx.toFixed(3) + 'deg');
    activeCard.style.setProperty('--ry', currentRy.toFixed(3) + 'deg');
    activeCard.style.setProperty('--tx', currentTx.toFixed(3));
    activeCard.style.setProperty('--ty', currentTy.toFixed(3));
    rafId = requestAnimationFrame(animate);
  }

  function resetCard(card) {
    if (!card) return;
    targetRx = 0; targetRy = 0; targetTx = 0; targetTy = 0;
    const reset = () => {
      currentRx = lerp(currentRx, 0, 0.2);
      currentRy = lerp(currentRy, 0, 0.2);
      currentTx = lerp(currentTx, 0, 0.2);
      currentTy = lerp(currentTy, 0, 0.2);
      card.style.setProperty('--rx', currentRx.toFixed(3) + 'deg');
      card.style.setProperty('--ry', currentRy.toFixed(3) + 'deg');
      card.style.setProperty('--tx', currentTx.toFixed(3));
      card.style.setProperty('--ty', currentTy.toFixed(3));
      if (Math.abs(currentRx) > 0.05 || Math.abs(currentRy) > 0.05) {
        requestAnimationFrame(reset);
      } else {
        card.classList.remove('is-tilting');
        card.style.removeProperty('--rx');
        card.style.removeProperty('--ry');
        card.style.removeProperty('--tx');
        card.style.removeProperty('--ty');
      }
    };
    requestAnimationFrame(reset);
  }

  grid.addEventListener('mousemove', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    if (activeCard && activeCard !== card) {
      resetCard(activeCard);
    }
    activeCard = card;
    card.classList.add('is-tilting');
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(animate);
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (e.clientX - cx) / (rect.width / 2);
    const dy = (e.clientY - cy) / (rect.height / 2);
    targetRy = dx * MAX_ANGLE;
    targetRx = -dy * MAX_ANGLE;
    targetTx = dx * 15;
    targetTy = dy * 15;
  }, { passive: true });

  grid.addEventListener('mouseleave', () => {
    if (!activeCard) return;
    cancelAnimationFrame(rafId);
    const cardToReset = activeCard;
    activeCard = null;
    resetCard(cardToReset);
  });

  grid.addEventListener('mouseout', (e) => {
    const card = e.target.closest('.card');
    if (card !== activeCard) return;
    const related = e.relatedTarget;
    if (related && related.closest && related.closest('.card') === activeCard) return;
    cancelAnimationFrame(rafId);
    const cardToReset = activeCard;
    activeCard = null;
    resetCard(cardToReset);
  });
})();

(async () => {
  bindRadio(document.body);
  try {
    const resp = await fetch('podcast_meta.json', { cache: 'no-store' });
    const meta = await resp.json();
    renderEpisodes(Array.isArray(meta) ? meta : []);
  } catch {
    document.getElementById('loader').innerHTML = '<span style="color:#ff0100">●</span> no se pudo cargar el podcast';
  }
})();
</script>
<script src="chat.js"></script>
</body>
</html>
